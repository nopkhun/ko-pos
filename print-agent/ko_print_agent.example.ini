; KO Print Agent - configuration
; คัดลอกไฟล์นี้เป็น ko_print_agent.ini แล้วแก้ค่าด้านล่างให้ตรงกับร้านของคุณ
; Copy this file to ko_print_agent.ini and edit the values below.

[odoo]
; URL ของ Odoo (ไม่ต้องมี / ปิดท้าย)
url = https://kodoo.viakuma.com

; Token: คัดลอกจาก Odoo > Point of Sale > Configuration > Print Agents
; Token: paste from Odoo -> Point of Sale -> Configuration -> Print Agents
token = PASTE_TOKEN_HERE

[agent]
; ความถี่ในการเช็คงานพิมพ์ใหม่ (วินาที)
; How often to poll Odoo for new jobs (seconds)
poll_interval = 1.0

; ไฟล์ log (จะหมุนไฟล์อัตโนมัติ ไม่โตไม่สิ้นสุด)
; Log file (rotates automatically, will not grow forever)
log_file = ko_print_agent.log

; วิธีแปลงรูปเป็นคำสั่งพิมพ์: bitImageRaster (ค่าเริ่มต้น แนะนำ) หรือ bitImageColumn
; (ลองเปลี่ยนเป็น bitImageColumn ถ้ารูปพิมพ์ออกมาเพี้ยน/มีลายเส้นผิดปกติ)
; Image raster mode: bitImageRaster (default, recommended) or bitImageColumn
; (try bitImageColumn if printed images look garbled/striped)
image_impl = bitImageRaster

; เวลาสูงสุดที่รอให้ "ส่งข้อมูลไปเครื่องพิมพ์" เสร็จ (วินาที) หลังจากเชื่อมต่อสำเร็จแล้ว
; แยกจากเวลารอเชื่อมต่อ (5 วินาที, ตายตัว) - ใบเสร็จรูปใหญ่ๆ อาจใช้เวลาส่งนานกว่า 5 วินาที
; Max seconds to wait for the PRINT DATA to finish sending once connected
; (separate from the fixed 5s connect timeout) - a large receipt image can
; take longer than 5s to transmit over a slow/busy WiFi link.
printer_send_timeout = 30

; --- ความปลอดภัย: จำกัดปลายทางที่โปรแกรมยอมส่งข้อมูลไปด้วย (ป้องกันชั้นที่ 2) ---
; --- Security: restrict which destinations the agent will ever connect to ---
; (defense in depth - even if an Odoo token were ever compromised, a bad job
; cannot make this agent connect to an arbitrary host/port)

; พอร์ตที่อนุญาต คั่นด้วยจุลภาค (ค่าเริ่มต้น 9100 = พอร์ตมาตรฐานของเครื่องพิมพ์ ESC/POS)
; เพิ่มเครื่องพิมพ์ตัวที่ 2 (เช่น เครื่องพิมพ์ในครัว) ที่ใช้พอร์ตอื่น ให้เติมคั่นด้วยจุลภาค
; Allowed ports, comma-separated (default 9100 = the standard ESC/POS port).
; Add a second printer (e.g. a kitchen printer) on a different port here too.
allowed_ports = 9100

; อนุญาต IP แบบ loopback (127.0.0.1) หรือไม่ - ปกติต้องเป็น false เสมอ
; เปิดเป็น true เฉพาะตอนทดสอบกับ tools/fake_printer.py บนเครื่องเดียวกันเท่านั้น
; Allow loopback (127.0.0.1) destinations - should normally always be false.
; Only set true for local testing against tools/fake_printer.py on this PC.
allow_loopback = false

; อนุญาตให้ระบุเครื่องพิมพ์เป็นชื่อโฮสต์ (เช่น kitchen-printer.local) แทน IP หรือไม่
; ค่าเริ่มต้นคือ false (ปฏิเสธชื่อโฮสต์ ต้องใช้ IP เท่านั้น) เพื่อความปลอดภัย
; Allow specifying a printer as a hostname (e.g. kitchen-printer.local)
; instead of a bare IP. Default false (hostnames rejected, IP only) for safety.
allow_hostnames = false

; (ไม่บังคับ) จำกัดเฉพาะ IP หรือช่วง IP (CIDR) ที่ระบุ คั่นด้วยจุลภาค เช่น
; 192.168.1.50,192.168.1.60 หรือ 192.168.1.0/24 - ถ้าเว้นว่างไว้ จะใช้กฎทั่วไป
; (private/link-local เท่านั้น + พอร์ตที่อนุญาต) โดยไม่จำกัด IP เจาะจงเพิ่มเติม
; (optional) Restrict to specific IP(s)/CIDR ranges, comma-separated, e.g.
; 192.168.1.50,192.168.1.60 or 192.168.1.0/24 - leave blank to just use the
; general rule (private/link-local only + allowed_ports) with no extra
; per-IP restriction.
allowed_hosts =
